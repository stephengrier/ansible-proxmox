- name: Create interface for management VLAN
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: nic0.2
    iface_type: vlan

- name: Create interface for server VLAN
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: nic0.3
    iface_type: vlan

- name: Create bridge for management VLAN
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: vmbr2
    iface_type: bridge
    cidr: '{{ ansible_host }}/24'
    gateway: '{{ ansible_host | regex_replace("^(.+)\.[^.]+$", "\1") }}.1'
    autostart: true

- name: Create bridge for server VLAN
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: vmbr3
    iface_type: bridge
    autostart: true

- name: Create host-only bridge for test network 1
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: vmbr4094
    iface_type: bridge
    bridge_ports: ''
    autostart: true

- name: Create host-only bridge for test network 2
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: vmbr4093
    iface_type: bridge
    bridge_ports: ''
    autostart: true

- name: Create a second host-only bridge for test network 2
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: proxmox1
    state: present
    iface: vmbr4092
    iface_type: bridge
    bridge_ports: ''
    autostart: true

- name: Apply network configuration
  community.proxmox.proxmox_node_network:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_token_id: '{{ api_token_id }}'
    api_token_secret: '{{ api_token_secret }}'
    node: "{{ proxmox_node }}"
    state: apply

- name: Check VM list is defined
  assert:
    that: proxmox_vms | length > 0
    fail_msg: "proxmox_vms must contain at least one VM definition."

- name: Create VMs from list
  include_tasks: create_vm.yml
  loop: "{{ proxmox_vms }}"
  loop_control:
    loop_var: vm
