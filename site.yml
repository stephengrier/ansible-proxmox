- name: Configure a Proxmox node
  hosts: all
  gather_facts: no

  roles:
    - linux_host
    - role: proxmox_node
      vars:
        proxmox_api_host: '{{ api_host }}'
        proxmox_api_user: '{{ api_user }}'
        proxmox_api_token_id: '{{ api_token_id }}'
        proxmox_api_token_secret: '{{ api_token_secret }}'
        proxmox_node: "proxmox1"
        proxmox_ciuser: 'steveg'

        proxmox_vms:
          - vmid: 1200
            template_name: 'tmpl-debian-13'
            name: 'testvm1'
            memory: '1024'
            cores: 4
            disk_size: "10G"
            bridge: 'vmbr3'
            start: true
            nics:
              - interface: 'net0'
                bridge: 'vmbr3'
          - vmid: 1201
            template_name: 'tmpl-openwrt-22.03.5'
            name: 'openwrt-test'
            memory: '512'
            cores: 2
            disk_size: '1G'
            start: true
            nics:
              - interface: 'net0'
                bridge: 'vmbr3'
              - interface: 'net1'
                bridge: 'vmbr4094'
                firewall: false
              - interface: 'net2'
                bridge: 'vmbr4093'
                firewall: false
              - interface: 'net3'
                bridge: 'vmbr4092'
                firewall: false
